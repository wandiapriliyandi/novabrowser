name: Build Android APK (NovaLite)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Prepare Versioned APK
        id: get_version
        run: |
          VERSION=$(grep 'versionName' android/app/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.6.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected App Version: $VERSION"

          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/NovaBrowser-v${VERSION}.apk"
          ls -la android/app/build/outputs/apk/debug/

          # Ekstrak changelog dinamis dari version.json
          CHANGELOG=$(python3 -c "import json; data=json.load(open('version.json')); print(data.get('changelog', 'Pembaruan stabilitas dan performa.'))" 2>/dev/null || jq -r '.changelog' version.json 2>/dev/null || echo "Pembaruan stabilitas dan performa.")
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBrowser-v${{ steps.get_version.outputs.VERSION }}-Android-APK
          path: android/app/build/outputs/apk/debug/NovaBrowser-v*.apk
          if-no-files-found: error

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBrowser-Setup-v${{ steps.get_version.outputs.VERSION }}-Windows
          path: NovaBrowserSetup.exe
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: NovaBrowser v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 NovaBrowser v${{ steps.get_version.outputs.VERSION }} Rilis Resmi

            ### 📢 Catatan Rilis & Yang Baru:
            ${{ steps.get_version.outputs.CHANGELOG }}

            ### 📦 File Unduhan Langsung:
            - **Windows (Setup Installer)**: `NovaBrowserSetup.exe` (Pemasangan mudah 1-klik dengan shortcut Desktop & Start Menu otomatis)
            - **Windows (Executable Saja)**: `NovaBrowser.exe` (Untuk pembaruan otomatis in-place)
            - **Android (APK)**: `NovaBrowser-v${{ steps.get_version.outputs.VERSION }}.apk`
          files: |
            android/app/build/outputs/apk/debug/NovaBrowser-v*.apk
            NovaBrowserSetup.exe
            NovaBrowser.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
