name: Build Android APK (NovaLite)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Versioned APK
        id: get_version
        run: |
          VERSION=$(grep 'versionName' android/app/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.2.5"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected App Version: $VERSION"

          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/NovaBrowser-v${VERSION}.apk"
          ls -la android/app/build/outputs/apk/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBrowser-v${{ steps.get_version.outputs.VERSION }}-APK
          path: android/app/build/outputs/apk/debug/NovaBrowser-v*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: NovaBrowser v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 NovaBrowser v${{ steps.get_version.outputs.VERSION }} Rilis Resmi

            ### 📦 File Unduhan Langsung:
            - **Windows**: `NovaBrowser.exe` (Portabel tanpa install)
            - **Android**: `NovaBrowser-v${{ steps.get_version.outputs.VERSION }}.apk`

            ### ✨ Fitur Utama:
            - **Auto-Update Resmi via GitHub Releases**: Pembaruan instan 1-klik untuk Windows & Android.
            - **Desain Bersih & Super Ringan**: Konsumsi RAM dan baterai ultra-hemat.
            - **Omnibox Clear Button (`✕`)**: Hapus alamat URL dalam 1 kali sentuh/klik.
          files: |
            android/app/build/outputs/apk/debug/NovaBrowser-v*.apk
            NovaBrowser.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
