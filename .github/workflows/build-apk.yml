name: Build Android APK (NovaLite)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd android
          # Pastikan keystore kompatibel dengan JDK 17
          if ! keytool -list -keystore app/novabrowser.jks -storepass novabrowser123 > /dev/null 2>&1; then
              echo "[INFO] Menghasilkan keystore resmi kompatibel JDK 17..."
              rm -f app/novabrowser.jks
              keytool -genkeypair -v -keystore app/novabrowser.jks -alias novabrowser -keyalg RSA -keysize 2048 -validity 10000 -storepass novabrowser123 -keypass novabrowser123 -dname "CN=NovaBrowser, OU=Dev, O=Nova, L=Jakarta, ST=ID, C=ID"
          fi
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Versioned APK
        id: get_version
        run: |
          VERSION=$(grep 'versionName' android/app/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.5.1"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected App Version: $VERSION"

          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/NovaBrowser-v${VERSION}.apk"
          ls -la android/app/build/outputs/apk/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBrowser-v${{ steps.get_version.outputs.VERSION }}-APK
          path: android/app/build/outputs/apk/debug/NovaBrowser-v*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: NovaBrowser v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 NovaBrowser v${{ steps.get_version.outputs.VERSION }} Rilis Resmi

            ### 📦 File Unduhan Langsung:
            - **Windows (Setup Installer)**: `NovaBrowserSetup.exe` (Pemasangan mudah 1-klik dengan shortcut Desktop & Start Menu otomatis)
            - **Android (APK)**: `NovaBrowser-v${{ steps.get_version.outputs.VERSION }}.apk`

            ### ✨ Fitur Utama:
            - **Windows Setup Installer**: Instalasi otomatis dan bersih tanpa perlu konfigurasi folder manual.
            - **Multi-Tab Android Modern**: Desain kartu tab interaktif, indikator aktif, dan tutup cepat.
            - **Auto-Update Resmi via GitHub Releases**: Pembaruan otomatis langsung dari aplikasi.
            - **Ultra Ringan & Cepat**: Konsumsi RAM dan baterai sangat hemat berbasis Chromium WebView2.
          files: |
            android/app/build/outputs/apk/debug/NovaBrowser-v*.apk
            NovaBrowserSetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
