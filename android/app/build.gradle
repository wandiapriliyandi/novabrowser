plugins {
    id 'com.android.application'
}

android {
    namespace 'com.novalite.browser'
    compileSdk 34

    defaultConfig {
        applicationId "com.novalite.browser"
        minSdk 21
        targetSdk 34
        versionCode 12
        versionName "1.3.1"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("novabrowser.jks")
            storePassword "novabrowser123"
            keyAlias "novabrowser"
            keyPassword "novabrowser123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Tidak ada dependensi eksternal berat agar APK ultra-ringan (~2 MB)
}

